# Creates PAID app and database services. Review the quoted cost before deploying.
# Hobby is sufficient; no Pro workspace upgrade is required.
services:
  - type: web
    name: project-hub
    runtime: node
    branch: main
    autoDeployTrigger: checksPass
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start -- -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: project-hub-db
          property: connectionString
      - key: DATABASE_SSL
        value: disable
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
databases:
  - name: project-hub-db
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    databaseName: project_hub
    user: project_hub_owner
    ipAllowList: []
